
<h2 class="sr-only">FPS Video Adjuster — upload a video and change its frame rate</h2>
<style>
#drop{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:48px 32px;text-align:center;cursor:pointer;background:var(--color-background-secondary);transition:background 0.15s,border-color 0.15s}
#drop.over{border-color:var(--color-border-primary);background:var(--color-background-primary)}
#drop i{font-size:40px;color:var(--color-text-secondary);display:block;margin-bottom:12px}
#editor{display:none;gap:16px;flex-direction:column}
#editor.on{display:flex}
canvas{width:100%;max-height:400px;display:block;background:#000;border-radius:var(--border-radius-md)}
.infobar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.pill{font-size:12px;padding:3px 10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);color:var(--color-text-secondary)}
.pill b{color:var(--color-text-primary)}
.panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:20px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}
label.lbl{font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:8px}
.bignum{font-size:36px;font-weight:500;color:var(--color-text-primary);line-height:1;margin-bottom:12px}
.bignum span{font-size:14px;font-weight:400;color:var(--color-text-secondary)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pre{font-size:12px;padding:4px 10px;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;color:var(--color-text-secondary);transition:all 0.12s}
.pre:hover,.pre.on{background:var(--color-background-info);color:var(--color-text-info);border-color:transparent}
.fmttabs{display:flex;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;margin-bottom:16px}
.fmt{flex:1;font-size:12px;padding:7px 4px;background:transparent;border:none;cursor:pointer;color:var(--color-text-secondary);transition:all 0.12s;text-align:center}
.fmt+.fmt{border-left:0.5px solid var(--color-border-secondary)}
.fmt.on{background:var(--color-text-primary);color:var(--color-background-primary)}
.row{display:flex;gap:8px;margin-top:8px}
.prog{display:none;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:14px 16px;margin-top:4px}
.prog.on{display:block}
.prog-top{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:8px}
.track{height:4px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0%;background:var(--color-text-primary);border-radius:2px;transition:width 0.1s}
</style>

<div id="drop" onclick="document.getElementById('fi').click()">
  <i class="ti ti-movie" aria-hidden="true"></i>
  <div style="font-size:15px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Drop video here or click to browse</div>
  <div style="font-size:13px;color:var(--color-text-secondary)">MP4 · WebM · MOV · AVI · MKV · OGV · M4V · 3GP</div>
</div>
<input type="file" id="fi" accept="video/*,.mkv,.avi,.mov,.mp4,.webm,.ogv,.m4v,.3gp" style="display:none">

<video id="hv" style="display:none"></video>

<div id="editor">
  <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">
    <canvas id="cv"></canvas>
    <div style="padding:10px 16px;border-top:0.5px solid var(--color-border-tertiary)">
      <div class="infobar">
        <div class="pill">File: <b id="iName">—</b></div>
        <div class="pill">Duration: <b id="iDur">—</b></div>
        <div class="pill">Size: <b id="iSz">—</b></div>
        <div class="pill">Resolution: <b id="iRes">—</b></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="grid2">
      <div>
        <label class="lbl">Target frame rate</label>
        <div class="bignum" id="fdisp">24 <span>fps</span></div>
        <input type="range" id="sl" min="1" max="120" value="24" step="1" style="width:100%">
        <div class="presets">
          <button class="pre" data-f="1">1</button>
          <button class="pre" data-f="5">5</button>
          <button class="pre" data-f="10">10</button>
          <button class="pre" data-f="15">15</button>
          <button class="pre on" data-f="24">24</button>
          <button class="pre" data-f="25">25</button>
          <button class="pre" data-f="30">30</button>
          <button class="pre" data-f="48">48</button>
          <button class="pre" data-f="60">60</button>
          <button class="pre" data-f="120">120</button>
        </div>
      </div>
      <div>
        <label class="lbl">Output format</label>
        <div class="fmttabs">
          <button class="fmt on" data-m="video/webm;codecs=vp9">WebM VP9</button>
          <button class="fmt" data-m="video/webm;codecs=vp8">WebM VP8</button>
          <button class="fmt" data-m="video/mp4">MP4</button>
        </div>
        <label class="lbl">Playback</label>
        <div class="row">
          <button id="ppBtn" onclick="togglePlay()" style="flex:1">
            <i class="ti ti-player-play" aria-hidden="true"></i> Play
          </button>
          <button onclick="resetV()">
            <i class="ti ti-refresh" aria-hidden="true"></i> Reset
          </button>
          <button onclick="newFile()" title="Load new file">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="expBtn" onclick="doExport()" style="flex:1">
            <i class="ti ti-download" aria-hidden="true"></i> Export video
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="prog" id="progBar">
    <div class="prog-top"><span id="stTxt">Processing...</span><span id="stPct">0%</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
</div>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fi'),editor=document.getElementById('editor'),cv=document.getElementById('cv'),hv=document.getElementById('hv'),sl=document.getElementById('sl'),fdisp=document.getElementById('fdisp'),ppBtn=document.getElementById('ppBtn'),expBtn=document.getElementById('expBtn'),progBar=document.getElementById('progBar'),stTxt=document.getElementById('stTxt'),stPct=document.getElementById('stPct'),fill=document.getElementById('fill');
const ctx2=cv.getContext('2d');
let fps=24,fmt='video/webm;codecs=vp9',playing=false,raf=null,lastT=0,objUrl=null;

drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
fi.addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0])});

function load(f){
  if(objUrl)URL.revokeObjectURL(objUrl);
  objUrl=URL.createObjectURL(f);
  hv.src=objUrl;
  hv.load();
  hv.onloadedmetadata=()=>{
    cv.width=hv.videoWidth||1280;
    cv.height=hv.videoHeight||720;
    document.getElementById('iName').textContent=f.name.length>22?f.name.slice(0,20)+'…':f.name;
    document.getElementById('iDur').textContent=fmt_dur(hv.duration);
    document.getElementById('iSz').textContent=fmt_sz(f.size);
    document.getElementById('iRes').textContent=hv.videoWidth+'×'+hv.videoHeight;
    drop.style.display='none';
    editor.classList.add('on');
    hv.currentTime=0;
    draw();
  };
}

function fmt_dur(s){if(isNaN(s))return'?';const m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc+'').padStart(2,'0')}
function fmt_sz(b){return b>1e6?(b/1e6).toFixed(1)+' MB':(b/1e3).toFixed(0)+' KB'}
function draw(){ctx2.drawImage(hv,0,0,cv.width,cv.height)}

function loop(t){
  if(!playing)return;
  if(t-lastT>=1000/fps){lastT=t;draw();if(hv.ended){playing=false;ppBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play';return}}
  raf=requestAnimationFrame(loop);
}

function togglePlay(){
  if(!hv.src)return;
  if(playing){playing=false;hv.pause();cancelAnimationFrame(raf);ppBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play'}
  else{playing=true;hv.play();lastT=0;ppBtn.innerHTML='<i class="ti ti-player-pause" aria-hidden="true"></i> Pause';raf=requestAnimationFrame(loop)}
}

function resetV(){playing=false;cancelAnimationFrame(raf);hv.pause();hv.currentTime=0;ppBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play';draw()}

function newFile(){
  playing=false;cancelAnimationFrame(raf);hv.pause();hv.src='';
  if(objUrl)URL.revokeObjectURL(objUrl);objUrl=null;
  editor.classList.remove('on');drop.style.display='';fi.value='';
  progBar.classList.remove('on');ctx2.clearRect(0,0,cv.width,cv.height);
  ppBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play';
}

sl.addEventListener('input',()=>{fps=parseInt(sl.value);fdisp.innerHTML=fps+' <span>fps</span>';document.querySelectorAll('.pre').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.f)===fps))});
document.querySelectorAll('.pre').forEach(b=>b.addEventListener('click',()=>{fps=parseInt(b.dataset.f);sl.value=fps;fdisp.innerHTML=fps+' <span>fps</span>';document.querySelectorAll('.pre').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
document.querySelectorAll('.fmt').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.fmt').forEach(x=>x.classList.remove('on'));t.classList.add('on');fmt=t.dataset.m}));

async function doExport(){
  if(!hv.src)return;
  expBtn.disabled=true;progBar.classList.add('on');fill.style.width='0%';stPct.textContent='0%';

  let mime=fmt;
  if(!MediaRecorder.isTypeSupported(mime)){
    const fb=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    mime=fb.find(f=>MediaRecorder.isTypeSupported(f))||'video/webm';
  }

  playing=false;cancelAnimationFrame(raf);hv.pause();ppBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play';

  const ec=document.createElement('canvas');ec.width=cv.width;ec.height=cv.height;
  const ec2=ec.getContext('2d');
  const stream=ec.captureStream(fps);
  const chunks=[];
  let rec;
  try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000})}catch(e){rec=new MediaRecorder(stream)}
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};

  const dur=hv.duration,step=1/fps;
  let t=0,n=0,total=Math.ceil(dur*fps);

  stTxt.textContent='Rendering at '+fps+' fps...';
  rec.start(100);
  hv.currentTime=0;

  while(t<=dur+step){
    await new Promise(res=>{hv.currentTime=Math.min(t,dur);hv.onseeked=()=>{ec2.drawImage(hv,0,0,ec.width,ec.height);t+=step;n++;const p=Math.min(100,Math.round(n/total*100));fill.style.width=p+'%';stPct.textContent=p+'%';res()}});
    if(n%15===0)await new Promise(r=>setTimeout(r,0));
  }

  rec.stop();
  rec.onstop=()=>{
    stTxt.textContent='Done! Downloading...';fill.style.width='100%';stPct.textContent='100%';
    const ext=mime.includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='fps-'+fps+'fps.'+ext;a.click();
    URL.revokeObjectURL(url);
    setTimeout(()=>{progBar.classList.remove('on');expBtn.disabled=false;hv.currentTime=0;draw()},2000);
  };
}
</script>
