<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Video Adjuster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent2: #ff3366;
    --text: #e8e8f0;
    --muted: #555570;
    --panel: #14141e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 48px;
  }

  h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Drop zone */
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--panel);
    position: relative;
    overflow: hidden;
  }

  #dropzone::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(0,255,136,0.03) 100%);
    pointer-events: none;
  }

  #dropzone:hover, #dropzone.dragover {
    border-color: var(--accent);
    background: rgba(0,255,136,0.04);
  }

  #dropzone.dragover {
    transform: scale(1.005);
  }

  .drop-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    display: block;
    filter: grayscale(1) opacity(0.5);
    transition: filter 0.2s;
  }

  #dropzone:hover .drop-icon {
    filter: none;
  }

  .drop-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .drop-sub {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.8;
  }

  #fileInput { display: none; }

  /* Main editor area */
  #editor {
    display: none;
    gap: 24px;
    flex-direction: column;
  }

  #editor.visible { display: flex; }

  /* Video preview */
  .video-wrap {
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
  }

  .video-wrap canvas {
    display: block;
    width: 100%;
    max-height: 480px;
    object-fit: contain;
    background: #000;
  }

  .video-info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .info-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  .info-pill .val {
    color: var(--accent);
    font-weight: 700;
  }

  /* Controls panel */
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: start;
  }

  @media (max-width: 600px) {
    .controls-grid { grid-template-columns: 1fr; }
    h1 { font-size: 2rem; }
  }

  .control-group label {
    display: block;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* FPS Slider */
  .fps-display {
    font-size: 3.5rem;
    font-weight: 800;
    letter-spacing: -3px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }

  .fps-display span {
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: 0;
    font-weight: 400;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,255,136,0.5);
    transition: box-shadow 0.2s;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 20px rgba(0,255,136,0.8);
  }

  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 12px rgba(0,255,136,0.5);
  }

  .fps-presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .preset-btn {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.68rem;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .preset-btn:hover, .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,136,0.06);
  }

  /* Playback controls */
  .playback-controls {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  .btn {
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    flex: 1;
  }

  .btn-primary:hover {
    background: #00ffaa;
    box-shadow: 0 0 20px rgba(0,255,136,0.4);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    flex: 1;
  }

  .btn-secondary:hover {
    border-color: var(--text);
  }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .btn-danger:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Progress & status */
  .status-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 20px;
    display: none;
  }

  .status-bar.visible { display: block; }

  .status-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #00ccff);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s;
    box-shadow: 0 0 8px rgba(0,255,136,0.6);
  }

  /* Format selector */
  .format-tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }

  .format-tab {
    flex: 1;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.68rem;
    padding: 8px 4px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    letter-spacing: 1px;
  }

  .format-tab + .format-tab {
    border-left: 1px solid var(--border);
  }

  .format-tab.active {
    background: var(--accent);
    color: #000;
    font-weight: 700;
  }

  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  /* Live preview indicator */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--accent); }
    50% { opacity: 0.4; box-shadow: none; }
  }

  .section-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* Hidden original video */
  #hiddenVideo { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1><span>FPS</span> SHIFTER</h1>
      <div class="subtitle">Video frame rate adjuster</div>
    </div>
  </header>

  <!-- Drop Zone -->
  <div id="dropzone" onclick="document.getElementById('fileInput').click()">
    <span class="drop-icon">🎬</span>
    <div class="drop-title">Drop your video here</div>
    <div class="drop-sub">
      Supports MP4 · WebM · MOV · AVI · MKV · OGV · M4V · 3GP<br>
      Click to browse or drag & drop
    </div>
  </div>
  <input type="file" id="fileInput" accept="video/*,.mkv,.avi,.mov,.mp4,.webm,.ogv,.m4v,.3gp">

  <!-- Editor -->
  <div id="editor">
    <div class="video-wrap">
      <canvas id="previewCanvas"></canvas>
      <div class="video-info-bar">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div class="info-pill">FILE <span class="val" id="infoName">—</span></div>
          <div class="info-pill">ORIG FPS <span class="val" id="infoFps">—</span></div>
          <div class="info-pill">DURATION <span class="val" id="infoDuration">—</span></div>
          <div class="info-pill">SIZE <span class="val" id="infoSize">—</span></div>
        </div>
        <div class="live-badge"><div class="live-dot"></div> LIVE PREVIEW</div>
      </div>
    </div>

    <div class="controls">
      <div class="controls-grid">
        <!-- FPS Control -->
        <div class="control-group">
          <label>Target Frame Rate</label>
          <div class="fps-display" id="fpsDisplay">24 <span>fps</span></div>
          <input type="range" id="fpsSlider" min="1" max="120" value="24" step="1">
          <div class="fps-presets">
            <button class="preset-btn" data-fps="1">1</button>
            <button class="preset-btn" data-fps="5">5</button>
            <button class="preset-btn" data-fps="10">10</button>
            <button class="preset-btn" data-fps="15">15</button>
            <button class="preset-btn active" data-fps="24">24</button>
            <button class="preset-btn" data-fps="25">25</button>
            <button class="preset-btn" data-fps="30">30</button>
            <button class="preset-btn" data-fps="48">48</button>
            <button class="preset-btn" data-fps="60">60</button>
            <button class="preset-btn" data-fps="120">120</button>
          </div>
        </div>

        <!-- Output & Actions -->
        <div class="control-group">
          <label>Output Format</label>
          <div class="format-tabs">
            <button class="format-tab active" data-fmt="video/webm;codecs=vp9">WebM</button>
            <button class="format-tab" data-fmt="video/webm;codecs=vp8">VP8</button>
            <button class="format-tab" data-fmt="video/mp4">MP4</button>
          </div>

          <div style="margin-top:20px">
            <label>Playback</label>
            <div class="playback-controls">
              <button class="btn btn-primary" id="playPauseBtn">▶ Play</button>
              <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
            </div>
          </div>

          <div style="margin-top:16px">
            <div class="action-row">
              <button class="btn btn-primary" id="exportBtn" style="flex:2">⬇ Export Video</button>
              <button class="btn btn-danger" id="newFileBtn">✕</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar">
      <div class="status-label">
        <span id="statusText">Processing...</span>
        <span id="statusPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>
</div>

<video id="hiddenVideo" crossorigin="anonymous"></video>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const editor = document.getElementById('editor');
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const hiddenVideo = document.getElementById('hiddenVideo');
const fpsSlider = document.getElementById('fpsSlider');
const fpsDisplay = document.getElementById('fpsDisplay');
const playPauseBtn = document.getElementById('playPauseBtn');
const resetBtn = document.getElementById('resetBtn');
const exportBtn = document.getElementById('exportBtn');
const newFileBtn = document.getElementById('newFileBtn');
const statusBar = document.getElementById('statusBar');
const statusText = document.getElementById('statusText');
const statusPct = document.getElementById('statusPct');
const progressFill = document.getElementById('progressFill');

let targetFps = 24;
let outputFormat = 'video/webm;codecs=vp9';
let animFrame = null;
let isPlaying = false;
let lastFrameTime = 0;
let videoObjectUrl = null;
let originalFps = null;

// Drag and drop
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadVideo(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadVideo(e.target.files[0]); });

function loadVideo(file) {
  if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
  videoObjectUrl = URL.createObjectURL(file);
  hiddenVideo.src = videoObjectUrl;
  hiddenVideo.load();

  hiddenVideo.addEventListener('loadedmetadata', () => {
    canvas.width = hiddenVideo.videoWidth || 1280;
    canvas.height = hiddenVideo.videoHeight || 720;

    // Estimate original FPS
    originalFps = null;
    if (hiddenVideo.webkitDecodedFrameCount !== undefined) {
      // Will be detected after a few frames
    }

    // Info bar
    document.getElementById('infoName').textContent = file.name.length > 20 ? file.name.slice(0, 18) + '…' : file.name;
    document.getElementById('infoDuration').textContent = formatDuration(hiddenVideo.duration);
    document.getElementById('infoSize').textContent = formatSize(file.size);
    document.getElementById('infoFps').textContent = '~' + targetFps;

    // Try to get fps from tracks
    if (hiddenVideo.getVideoPlaybackQuality) {
      // Can infer later
    }

    dropzone.style.display = 'none';
    editor.classList.add('visible');

    hiddenVideo.currentTime = 0;
    drawFrame();
  }, { once: true });
}

function formatDuration(s) {
  if (isNaN(s)) return '?';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
function formatSize(bytes) {
  if (bytes > 1e6) return (bytes/1e6).toFixed(1) + ' MB';
  return (bytes/1e3).toFixed(0) + ' KB';
}

function drawFrame() {
  if (canvas.width && canvas.height) {
    ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
  }
}

// FPS-controlled playback loop
function playLoop(timestamp) {
  if (!isPlaying) return;
  const interval = 1000 / targetFps;
  if (timestamp - lastFrameTime >= interval) {
    lastFrameTime = timestamp;
    drawFrame();
    if (hiddenVideo.ended) {
      isPlaying = false;
      playPauseBtn.textContent = '▶ Play';
      return;
    }
  }
  animFrame = requestAnimationFrame(playLoop);
}

playPauseBtn.addEventListener('click', () => {
  if (!hiddenVideo.src) return;
  if (isPlaying) {
    isPlaying = false;
    hiddenVideo.pause();
    cancelAnimationFrame(animFrame);
    playPauseBtn.textContent = '▶ Play';
  } else {
    isPlaying = true;
    hiddenVideo.play();
    lastFrameTime = 0;
    playPauseBtn.textContent = '⏸ Pause';
    animFrame = requestAnimationFrame(playLoop);
  }
});

resetBtn.addEventListener('click', () => {
  isPlaying = false;
  cancelAnimationFrame(animFrame);
  hiddenVideo.pause();
  hiddenVideo.currentTime = 0;
  playPauseBtn.textContent = '▶ Play';
  drawFrame();
});

// FPS slider
fpsSlider.addEventListener('input', () => {
  targetFps = parseInt(fpsSlider.value);
  fpsDisplay.innerHTML = `${targetFps} <span>fps</span>`;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.fps) === targetFps);
  });
});

// Preset buttons
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    targetFps = parseInt(btn.dataset.fps);
    fpsSlider.value = targetFps;
    fpsDisplay.innerHTML = `${targetFps} <span>fps</span>`;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Format tabs
document.querySelectorAll('.format-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    outputFormat = tab.dataset.fmt;
  });
});

// Export
exportBtn.addEventListener('click', exportVideo);

async function exportVideo() {
  if (!hiddenVideo.src) return;

  exportBtn.disabled = true;
  statusBar.classList.add('visible');
  progressFill.style.width = '0%';
  statusText.textContent = 'Preparing frames...';
  statusPct.textContent = '0%';

  // Determine supported format
  let mimeType = outputFormat;
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    const fallbacks = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4'
    ];
    mimeType = fallbacks.find(f => MediaRecorder.isTypeSupported(f)) || 'video/webm';
    statusText.textContent = `Using ${mimeType.split(';')[0].split('/')[1].toUpperCase()} (fallback)`;
  }

  // Pause live playback
  const wasPlaying = isPlaying;
  isPlaying = false;
  cancelAnimationFrame(animFrame);
  hiddenVideo.pause();
  playPauseBtn.textContent = '▶ Play';

  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;
  const exportCtx = exportCanvas.getContext('2d');

  const stream = exportCanvas.captureStream(targetFps);
  const chunks = [];
  let recorder;

  try {
    recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
  } catch(e) {
    recorder = new MediaRecorder(stream);
  }

  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

  const duration = hiddenVideo.duration;
  const frameInterval = 1 / targetFps;
  let currentTime = 0;
  let frameCount = 0;
  const totalFrames = Math.ceil(duration * targetFps);

  recorder.start(100);

  hiddenVideo.currentTime = 0;

  statusText.textContent = 'Rendering frames at ' + targetFps + ' fps...';

  function seekAndCapture() {
    return new Promise(resolve => {
      if (currentTime > duration + 0.01) { resolve(); return; }

      hiddenVideo.currentTime = currentTime;
      hiddenVideo.onseeked = () => {
        exportCtx.drawImage(hiddenVideo, 0, 0, exportCanvas.width, exportCanvas.height);
        currentTime += frameInterval;
        frameCount++;

        const pct = Math.min(100, Math.round((frameCount / totalFrames) * 100));
        progressFill.style.width = pct + '%';
        statusPct.textContent = pct + '%';

        resolve();
      };
    });
  }

  // Process frames in batches to avoid blocking UI
  async function processAll() {
    while (currentTime <= duration + frameInterval) {
      await seekAndCapture();
      if (frameCount % 10 === 0) {
        await new Promise(r => setTimeout(r, 0));
      }
    }
  }

  await processAll();

  recorder.stop();

  recorder.onstop = () => {
    statusText.textContent = 'Encoding complete. Downloading...';
    progressFill.style.width = '100%';
    statusPct.textContent = '100%';

    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fps-shifted-${targetFps}fps.${ext}`;
    a.click();
    URL.revokeObjectURL(url);

    setTimeout(() => {
      statusBar.classList.remove('visible');
      exportBtn.disabled = false;
      hiddenVideo.currentTime = 0;
      drawFrame();
    }, 2000);
  };
}

// New file
newFileBtn.addEventListener('click', () => {
  isPlaying = false;
  cancelAnimationFrame(animFrame);
  hiddenVideo.pause();
  hiddenVideo.src = '';
  if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
  videoObjectUrl = null;
  editor.classList.remove('visible');
  dropzone.style.display = '';
  fileInput.value = '';
  statusBar.classList.remove('visible');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});
</script>
</body>
